name: Run Test & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Run Text-to-SQL backend script
      run: |
        python text_to_sql.py

    - name: Deploy Frontend to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: . # Deploy root files (index.html, styles.css, app.js)
        branch: gh-pages
